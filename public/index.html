<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f0f0f" />
  <link rel="manifest" href="/manifest.json" />
  <title>ListenTogether</title>
  <style>
    :root { --bg: #0f0f0f; --card: #1c1c1e; --accent: #ff2d55; --text: #ffffff; --muted: #9a9a9e; }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
    
    header { padding: 12px 16px; background: rgba(24,24,26,0.95); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2c2c2e; }
    .badge { background: #2c2c2e; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }

    #join-screen { position: fixed; inset: 0; background: var(--bg); z-index: 50; display: flex; flex-direction: column; justify-content: center; padding: 28px; gap: 14px; }
    input, button { padding: 13px; border-radius: 10px; border: none; font-size: 16px; }
    input { background: #1c1c1e; color: white; outline: none; border: 1px solid #2c2c2e; }
    input:focus { border-color: var(--accent); }
    button { background: var(--accent); color: white; font-weight: 700; cursor: pointer; }
    button.secondary { background: #2c2c2e; }

    .tabs { display: flex; background: #161618; border-bottom: 1px solid #2c2c2e; }
    .tab { flex: 1; padding: 11px 4px; text-align: center; color: var(--muted); cursor: pointer; font-weight: 600; font-size: 14px; }
    .tab.active { color: var(--text); border-bottom: 2px solid var(--accent); }

    .panel { flex: 1; overflow-y: auto; padding: 14px; display: none; flex-direction: column; gap: 10px; position: relative; }
    .panel.active { display: flex; }

    /* Live Autocomplete Dropdown */
    .search-wrap { position: relative; display: flex; gap: 8px; }
    #suggestions-box {
      position: absolute; top: 50px; left: 0; right: 0; background: #242426;
      border-radius: 10px; border: 1px solid #3a3a3c; z-index: 30;
      display: none; flex-direction: column; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .sug-item { padding: 11px 14px; font-size: 14px; border-bottom: 1px solid #2f2f32; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .sug-item:last-child { border-bottom: none; }
    .sug-item:active { background: #3a3a3c; }

    /* Track Cards */
    .track { display: flex; align-items: center; gap: 12px; background: var(--card); padding: 8px 10px; border-radius: 10px; }
    .track img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
    .track-info { flex: 1; min-width: 0; }
    .track-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .track-actions { display: flex; gap: 6px; }
    .track-actions button { padding: 7px 11px; font-size: 12px; border-radius: 8px; }

    /* Lyrics */
    #lyrics-content { white-space: pre-wrap; line-height: 1.6; font-size: 15px; color: #e5e5ea; text-align: center; padding: 12px 4px; }

    /* Chat */
    #chat-box { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .msg { background: var(--card); padding: 9px 12px; border-radius: 12px; max-width: 85%; font-size: 14px; }
    .msg.sys { background: transparent; color: var(--muted); font-size: 12px; align-self: center; }
    .msg-meta { font-size: 11px; color: var(--accent); margin-bottom: 2px; font-weight: 700; }
    .chat-input { display: flex; gap: 8px; padding-top: 6px; }
    .chat-input input { flex: 1; }

    /* Bottom Player */
    .player { background: #18181a; padding: 10px 14px 14px; border-top: 1px solid #2c2c2e; display: flex; flex-direction: column; gap: 8px; }
    .now-playing { display: flex; align-items: center; gap: 10px; }
    .now-playing img { width: 44px; height: 44px; border-radius: 8px; background: #2c2c2e; object-fit: cover; }
    audio { width: 100%; height: 36px; border-radius: 8px; }
    #status-text { font-size: 11px; color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>

  <div id="join-screen">
    <h2 style="margin:0;">🎵 ListenTogether</h2>
    <p style="margin:0; color:var(--muted); font-size:14px;">YouTube Music Sync & Chat for Android & iOS</p>
    <input id="username" placeholder="Your Name" />
    <input id="room-id" placeholder="Room Code (e.g., vibe)" />
    <button onclick="joinRoom()">Join Room</button>
  </div>

  <header>
    <strong id="header-room">#room</strong>
    <span class="badge" id="user-count">1 online</span>
  </header>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('search', this)">Search</div>
    <div class="tab" onclick="switchTab('queue', this)">Queue (<span id="q-count">0</span>)</div>
    <div class="tab" onclick="switchTab('lyrics', this)">Lyrics</div>
    <div class="tab" onclick="switchTab('chat', this)">Chat</div>
  </div>

  <!-- Search Tab -->
  <div id="tab-search" class="panel active">
    <div class="search-wrap">
      <input id="search-input" style="flex:1;" placeholder="Search songs, artists..." autocomplete="off"
             oninput="handleTyping()" onkeydown="if(event.key==='Enter') searchMusic()" />
      <button onclick="searchMusic()">Go</button>
      <div id="suggestions-box"></div>
    </div>
    <div id="search-results" style="display:flex; flex-direction:column; gap:8px;"></div>
  </div>

  <!-- Queue Tab -->
  <div id="tab-queue" class="panel">
    <button class="secondary" onclick="socket.emit('next-track', { roomId })">Skip to Next Track ⏭</button>
    <div id="queue-list" style="display:flex; flex-direction:column; gap:8px;"></div>
  </div>

  <!-- Lyrics Tab -->
  <div id="tab-lyrics" class="panel">
    <div id="lyrics-content">Play a song to load lyrics.</div>
  </div>

  <!-- Chat Tab -->
  <div id="tab-chat" class="panel">
    <div id="chat-box"></div>
    <div class="chat-input">
      <input id="chat-msg" placeholder="Message room..." onkeydown="if(event.key==='Enter') sendChat()" />
      <button onclick="sendChat()">Send</button>
    </div>
  </div>

  <!-- Player -->
  <div class="player">
    <div class="now-playing">
      <img id="np-art" src="" alt="" />
      <div class="track-info">
        <div class="track-title" id="np-title">Nothing playing</div>
        <div class="track-sub" id="np-author">Search a song to start</div>
        <div id="status-text"></div>
      </div>
    </div>
    <audio id="audio" controls playsinline></audio>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let roomId = '';
    let isRemoteSync = false;
    let typingTimer = null;
    const audio = document.getElementById('audio');
    const sugBox = document.getElementById('suggestions-box');

    function switchTab(name, el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('tab-' + name).classList.add('active');
    }

    function joinRoom() {
      const username = document.getElementById('username').value.trim() || 'Guest';
      roomId = document.getElementById('room-id').value.trim().toLowerCase() || 'lobby';
      document.getElementById('header-room').innerText = `#${roomId}`;
      document.getElementById('join-screen').style.display = 'none';
      audio.play().catch(() => {});
      socket.emit('join-room', { roomId, username });
    }

    // Live Autocomplete While Typing
    function handleTyping() {
      clearTimeout(typingTimer);
      const q = document.getElementById('search-input').value.trim();
      if (!q) {
        sugBox.style.display = 'none';
        return;
      }
      typingTimer = setTimeout(async () => {
        try {
          const res = await fetch(`/api/suggestions?q=${encodeURIComponent(q)}`);
          const list = await res.json();
          if (!list.length) {
            sugBox.style.display = 'none';
            return;
          }
          sugBox.innerHTML = '';
          list.forEach(text => {
            const div = document.createElement('div');
            div.className = 'sug-item';
            div.innerHTML = `🔍 <span>${text}</span>`;
            div.onclick = () => {
              document.getElementById('search-input').value = text;
              sugBox.style.display = 'none';
              searchMusic();
            };
            sugBox.appendChild(div);
          });
          sugBox.style.display = 'flex';
        } catch (_) {}
      }, 220);
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-wrap')) sugBox.style.display = 'none';
    });

    async function searchMusic() {
      sugBox.style.display = 'none';
      const q = document.getElementById('search-input').value.trim();
      if (!q) return;
      const container = document.getElementById('search-results');
      container.innerHTML = '<p style="color:var(--muted); text-align:center;">Searching YouTube Music...</p>';

      const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
      const tracks = await res.json();
      container.innerHTML = tracks.length ? '' : '<p style="color:var(--muted);">No results found.</p>';

      tracks.forEach(track => {
        const div = document.createElement('div');
        div.className = 'track';
        div.innerHTML = `
          <img src="${track.thumbnail}" />
          <div class="track-info">
            <div class="track-title">${track.title}</div>
            <div class="track-sub">${track.author} ${track.duration ? '• ' + track.duration : ''}</div>
          </div>
          <div class="track-actions">
            <button onclick='playNow(${JSON.stringify(track).replace(/'/g, "'")})'>Play</button>
            <button class="secondary" onclick='addQueue(${JSON.stringify(track).replace(/'/g, "'")})'>+Q</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function playNow(track) { socket.emit('play-track', { roomId, track }); }
    function addQueue(track) { socket.emit('add-to-queue', { roomId, track }); }

    async function fetchLyrics(videoId) {
      const box = document.getElementById('lyrics-content');
      box.innerText = 'Loading lyrics...';
      try {
        const res = await fetch(`/api/lyrics/${videoId}`);
        const data = await res.json();
        box.innerText = data.lyrics;
      } catch (_) {
        box.innerText = 'Lyrics unavailable.';
      }
    }

    function loadTrack(track, position, shouldPlay) {
      if (!track) return;
      document.getElementById('np-title').innerText = track.title;
      document.getElementById('np-author').innerText = track.author;
      document.getElementById('np-art').src = track.thumbnail;
      document.getElementById('status-text').innerText = 'Buffering stream...';
      fetchLyrics(track.id);

      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.title,
          artist: track.author,
          artwork: [{ src: track.thumbnail, sizes: '512x512', type: 'image/jpeg' }]
        });
        navigator.mediaSession.setActionHandler('play', () => audio.play());
        navigator.mediaSession.setActionHandler('pause', () => audio.pause());
        navigator.mediaSession.setActionHandler('nexttrack', () => socket.emit('next-track', { roomId }));
      }

      isRemoteSync = true;
      audio.src = `/api/stream/${track.id}`;
      audio.currentTime = position || 0;
      if (shouldPlay) {
        audio.play().catch(() => {
          document.getElementById('status-text').innerText = 'Tap ▶ below to start audio';
        });
      }
      setTimeout(() => { isRemoteSync = false; }, 600);
    }

    audio.addEventListener('playing', () => {
      document.getElementById('status-text').innerText = '';
    });
    audio.addEventListener('error', () => {
      document.getElementById('status-text').innerText = 'Stream error — try another track or retry';
    });

    audio.addEventListener('play', () => {
      if (!isRemoteSync) socket.emit('sync-action', { roomId, action: 'play', position: audio.currentTime });
    });
    audio.addEventListener('pause', () => {
      if (!isRemoteSync) socket.emit('sync-action', { roomId, action: 'pause', position: audio.currentTime });
    });
    audio.addEventListener('seeked', () => {
      if (!isRemoteSync) socket.emit('sync-action', { roomId, action: 'play', position: audio.currentTime });
    });
    audio.addEventListener('ended', () => { socket.emit('next-track', { roomId }); });

    socket.on('room-state', (state) => {
      renderQueue(state.queue);
      state.messages.forEach(appendChat);
      if (state.currentTrack) loadTrack(state.currentTrack, state.position, state.isPlaying);
    });

    socket.on('track-changed', ({ track, isPlaying, position }) => { loadTrack(track, position, isPlaying); });

    socket.on('sync-update', ({ action, position }) => {
      isRemoteSync = true;
      if (Math.abs(audio.currentTime - position) > 1.5) audio.currentTime = position;
      if (action === 'play') audio.play().catch(() => {});
      if (action === 'pause') audio.pause();
      setTimeout(() => { isRemoteSync = false; }, 600);
    });

    socket.on('queue-updated', renderQueue);
    socket.on('users-update', (users) => { document.getElementById('user-count').innerText = `${users.length} online`; });

    function renderQueue(queue) {
      document.getElementById('q-count').innerText = queue.length;
      const list = document.getElementById('queue-list');
      list.innerHTML = queue.length ? '' : '<p style="color:var(--muted);">Queue is empty.</p>';
      queue.forEach((t, i) => {
        const div = document.createElement('div');
        div.className = 'track';
        div.innerHTML = `<img src="${t.thumbnail}" /><div class="track-info"><div class="track-title">${i+1}. ${t.title}</div><div class="track-sub">${t.author}</div></div>`;
        list.appendChild(div);
      });
    }

    function sendChat() {
      const input = document.getElementById('chat-msg');
      const text = input.value.trim();
      if (!text) return;
      socket.emit('send-chat', { roomId, text });
      input.value = '';
    }

    socket.on('chat-message', appendChat);

    function appendChat(msg) {
      const box = document.getElementById('chat-box');
      const div = document.createElement('div');
      if (msg.system) {
        div.className = 'msg sys';
        div.innerText = msg.text;
      } else {
        div.className = 'msg';
        div.innerHTML = `<div class="msg-meta">${msg.user} • ${msg.time}</div><div>${msg.text}</div>`;
      }
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
